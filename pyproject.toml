[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeromihaht-robotctrl_jd301"
version = "0.1.0"
description = "在同一个输入里两两比对，检测机器人运动控制工程师·分块策略对召回的影响相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jeromihaht" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jeromihaht.github.io"
Repository = "https://github.com/jeromihaht/robotctrl_jd301"
Issues = "https://github.com/jeromihaht/robotctrl_jd301/issues"

[project.scripts]
robotctrl_jd301 = "robotctrl_jd301:main"

[tool.setuptools]
py-modules = ["robotctrl_jd301"]
